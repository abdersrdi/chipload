name: Chipload

options:
  bundleIdPrefix: com.chipload
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  ChiploadCore:
    path: .

targets:
  Chipload-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
    dependencies:
      - package: ChiploadCore
        product: ChiploadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipload.app
        PRODUCT_NAME: Chipload
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Chipload
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ChiploadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Chipload-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chipload.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Chipload-iOS:
    build:
      targets:
        Chipload-iOS: all
    test:
      targets:
        - ChiploadUITests
